name: Cloudflare login fix and deploy

on:
  push:
    branches: [main]
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-cbodataentry-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build public website
        run: npm run build
      - name: Test configuration, API and deployment order
        run: npm test

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      CLOUDFLARE_PAGES_PROJECT: cbodataentry
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - name: Verify Google, sync runtime secrets and deploy production
        run: npm run deploy
